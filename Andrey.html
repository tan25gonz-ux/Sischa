<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control Admin - Monitoreo en Tiempo Real</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --primary: #4f46e5;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-400: #9ca3af;
            --gray-600: #4b5563;
            --gray-800: #1f2937;
            --gray-900: #111827;
            --radius: 16px;
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.07);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.08);
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #f1f5f9;
            background-image: radial-gradient(at 0% 0%, rgba(79, 70, 229, 0.06) 0px, transparent 50%),
                              radial-gradient(at 100% 0%, rgba(14, 165, 233, 0.06) 0px, transparent 50%);
            color: var(--gray-800);
            padding: 20px;
            min-height: 100vh;
        }

        .app-container { max-width: 1200px; margin: 0 auto; }

        .header-panel {
            background: linear-gradient(135deg, var(--primary) 0%, #8b5cf6 100%);
            padding: 24px 32px;
            border-radius: var(--radius);
            box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.35);
            margin-bottom: 24px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-panel h2 { font-size: 24px; font-weight: 800; margin: 0; }
        .header-panel small { font-size: 14px; opacity: 0.9; }

        /* --- ALERTAS DE CONTENEDORES --- */
        .alertas-container {
            background: #fffbeb;
            border: 2px solid #fcd34d;
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 24px;
            box-shadow: var(--shadow);
        }
        .alertas-container h3 {
            color: #b45309;
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .alerta-item {
            background: white;
            padding: 12px 16px;
            border-radius: 8px;
            border-left: 4px solid #f59e0b;
            margin-bottom: 8px;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .alerta-item:last-child { margin-bottom: 0; }
        .alerta-sucursal { font-weight: 800; color: var(--gray-800); }
        .alerta-detalle { color: var(--gray-600); }
        
        .btn-resolver-alerta {
            background: #10b981;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-resolver-alerta:hover { background: #059669; }

        .grid-cajas {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 20px;
            align-items: start;
        }

        .card-caja {
            background: white;
            padding: 24px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--gray-200);
            position: relative;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card-caja:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
        
        .card-caja::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 6px;
            background: linear-gradient(90deg, var(--primary), #8b5cf6);
        }

        .badge-live {
            background: #ecfdf5;
            color: #065f46;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 800;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .dot {
            width: 8px; height: 8px;
            background: #10b981;
            border-radius: 50%;
            animation: blink 1.5s infinite;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        .monto-vivo {
            font-size: 32px;
            font-weight: 800;
            color: #065f46;
            margin: 12px 0 16px;
            background: linear-gradient(135deg, #ecfdf5, #d1fae5);
            padding: 16px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #a7f3d0;
        }

        .detalle-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px dashed var(--gray-200);
            font-size: 13px;
            color: var(--gray-600);
            font-weight: 600;
        }
        .detalle-item:last-child { border-bottom: none; }
        
        .monto-pos { color: #059669; font-weight: 800; }
        .monto-neg { color: #dc2626; font-weight: 800; }

        /* ESTILOS PARA EL DETALLE DEL DÍA */
        .acordeon-container {
            margin-top: 15px;
            border: 1px solid var(--gray-200);
            border-radius: 10px;
            overflow: hidden;
        }
        .btn-acordeon {
            width: 100%;
            background: #e0e7ff;
            color: #3730a3;
            padding: 12px;
            border: none;
            font-weight: 800;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }
        .btn-acordeon:hover { background: #c7d2fe; }
        .acordeon-listado {
            display: none;
            max-height: 250px;
            overflow-y: auto;
            background: white;
            padding: 12px;
        }
        .acordeon-listado.active { display: block; }
        
        .lista-header {
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 8px;
            padding-bottom: 4px;
            border-bottom: 1px solid var(--gray-200);
        }
        .lista-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            padding: 6px 0;
            border-bottom: 1px dotted var(--gray-200);
        }
        .lista-item:last-child { border-bottom: none; }
        .badge-origen {
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 6px;
            font-weight: 700;
        }
        .origen-curso { background: #dcfce7; color: #166534; }
        .origen-cerrado { background: #f1f5f9; color: #475569; }

        /* ESTILOS DEL INVENTARIO DEL DÍA */
        .inventario-container {
            margin-top: 15px;
            border: 1px solid var(--gray-200);
            border-radius: 10px;
            overflow: hidden;
        }
        .btn-toggle-inventario {
            width: 100%;
            background: #f8fafc;
            color: #1e293b;
            padding: 12px;
            border: none;
            font-weight: 800;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
            border-top: 1px solid var(--gray-200);
        }
        .btn-toggle-inventario:hover { background: #e2e8f0; }
        .inventario-listado {
            display: none;
            max-height: 200px;
            overflow-y: auto;
            background: white;
            padding: 10px;
        }
        .inventario-listado.active { display: block; }
        .inv-item {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            padding: 6px 8px;
            border-bottom: 1px solid var(--gray-100);
            font-weight: 600;
            color: var(--gray-600);
        }
        .inv-item:last-child { border-bottom: none; }
        .inv-total {
            background: var(--gray-50);
            padding: 8px;
            font-size: 12px;
            font-weight: 800;
            text-align: center;
            color: var(--primary);
            border-bottom: 1px solid var(--gray-200);
        }

        /* MÓDULO DE KILOS POR SUCURSAL */
        .kilos-card-box {
            margin-top: 15px;
            border: 1px solid #bfdbfe;
            border-radius: 10px;
            background: #eff6ff;
            overflow: hidden;
        }
        .kilos-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: #dbeafe;
            color: #1e3a8a;
            font-weight: 800;
            font-size: 13px;
            cursor: pointer;
        }
        .kilos-card-header:hover { background: #bfdbfe; }
        .btn-add-kilos {
            background: #2563eb;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            margin-left: auto;
            margin-right: 10px;
        }
        .btn-add-kilos:hover { background: #1d4ed8; }
        
        .kilos-listado-mini {
            display: none;
            max-height: 150px;
            overflow-y: auto;
            background: white;
            padding: 10px;
            border-top: 1px solid #bfdbfe;
        }
        .kilos-listado-mini.active { display: block; }
        .kilos-total-box {
            background: #e0e7ff;
            color: #3730a3;
            padding: 8px;
            font-size: 12px;
            font-weight: 800;
            text-align: center;
            border-bottom: 1px solid #bfdbfe;
        }
        .kilos-mini-item {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--gray-600);
            padding: 4px 0;
            border-bottom: 1px dashed #bfdbfe;
        }
        .kilos-mini-item:last-child { border-bottom: none; }

        /* NUEVO MÓDULO DE INVENTARIO HISTÓRICO */
        .inventario-historico-box {
            margin-top: 15px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            background: #f3f4f6;
            overflow: hidden;
        }
        .inventario-historico-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: #e5e7eb;
            color: var(--gray-800);
            font-weight: 800;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .inventario-historico-header:hover { background: #d1d5db; }
        .inventario-historico-listado {
            display: none;
            max-height: 200px;
            overflow-y: auto;
            background: white;
            padding: 10px;
            border-top: 1px solid #d1d5db;
        }
        .inventario-historico-listado.active { display: block; }
        
        .inv-hist-item {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            padding: 6px 8px;
            border-bottom: 1px solid var(--gray-100);
            font-weight: 600;
            color: var(--gray-600);
        }
        .inv-hist-item:last-child { border-bottom: none; }
        .inv-hist-total {
            background: #f8fafc;
            padding: 8px;
            font-size: 12px;
            font-weight: 800;
            text-align: center;
            color: var(--gray-800);
            border-bottom: 1px solid var(--gray-200);
        }

        .actions-box {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .btn-inyectar {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s;
            box-shadow: 0 4px 10px -2px rgba(16, 185, 129, 0.4);
        }
        .btn-inyectar:hover { transform: translateY(-1px); box-shadow: 0 6px 15px -2px rgba(16, 185, 129, 0.5); }

        .lista-envios { margin-top: 10px; }
        .envio-item {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--gray-50); border: 1px solid var(--gray-200);
            padding: 8px 12px; border-radius: 8px; margin-bottom: 6px;
            font-size: 12px; font-weight: 600;
        }
        .btn-eliminar-envio {
            background: #fee2e2; color: #dc2626; border: none;
            padding: 4px 8px; border-radius: 6px; cursor: pointer; font-weight: 800;
        }

        /* MODAL */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background: white;
            border-radius: 20px;
            padding: 28px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
            animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .modal-box h3 { margin-bottom: 16px; color: var(--gray-900); font-size: 20px; }
        .modal-box label { font-size: 13px; font-weight: 700; color: var(--gray-600); display: block; margin-bottom: 6px; }
        .modal-box input {
            width: 100%; padding: 12px 14px;
            border: 1.5px solid var(--gray-200);
            border-radius: 8px; font-size: 14px;
            font-family: inherit; margin-bottom: 16px;
            transition: all 0.15s;
        }
        .modal-box input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); }
        
        .modal-buttons { display: flex; gap: 10px; }
        .btn-cancel { background: var(--gray-100); color: var(--gray-600); border: none; padding: 12px; border-radius: 8px; font-weight: 700; cursor: pointer; flex: 1; }
        .btn-confirm { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 700; cursor: pointer; flex: 1; }
    
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header-panel">
            <div>
                <h2>🔴 Panel de Administración</h2>
                <small>Monitoreo de cajas, inventario y solicitudes</small>
            </div>
        </div>

        <!-- ALERTAS DE CONTENEDORES SOLICITADOS -->
        <div id="alertas-contenedores" class="alertas-container" style="display: none;">
            <h3>⚠️ Solicitudes de Contenedores Pendientes</h3>
            <div id="lista-alertas-contenedores"></div>
        </div>

        <div id="contenedor-cajas" class="grid-cajas">
            <p style="color:var(--gray-600); font-weight: 600;">Cargando cajas de sucursales en vivo...</p>
        </div>
    </div>

    <!-- MODAL PARA INYECTAR DINERO -->
    <div id="modal-inyectar" class="modal-overlay">
        <div class="modal-box">
            <h3>💸 Inyectar Dinero</h3>
            <p style="font-size:13px; color:var(--gray-600); margin-bottom:16px;">
                Enviar dinero a la sucursal <b id="modal-sucursal-nombre"></b>.
            </p>
            
            <label>Monto a enviar (₡)</label>
            <input type="text" id="input-monto-inyectar" placeholder="Ej: 50 000" oninput="formatearMoneda(this)">
            
            <label>Motivo / Detalle</label>
            <input type="text" id="input-motivo-inyectar" placeholder="Ej: Envío de administración">

            <div class="modal-buttons">
                <button class="btn-cancel" onclick="cerrarModal()">Cancelar</button>
                <button class="btn-confirm" onclick="confirmarInyeccion()">💾 Enviar Dinero</button>
            </div>
        </div>
    </div>

    <!-- MODAL PARA AGREGAR KILOS (POR SUCURSAL) -->
    <div id="modal-kilos" class="modal-overlay">
        <div class="modal-box">
            <h3>⚖️ Ingresar Kilos</h3>
            <p style="font-size:13px; color:var(--gray-600); margin-bottom:16px;">
                Registrar kilos sueltos para la sucursal <b id="modal-kilos-sucursal-nombre"></b>.
            </p>
            
            <label>Cantidad de Kilos</label>
            <input type="number" id="input-kilos-cantidad" placeholder="Ej: 150.5" step="0.01">
            
            <label>Fecha</label>
            <input type="date" id="input-kilos-fecha">
            
            <label>Motivo</label>
            <input type="text" id="input-kilos-motivo" placeholder="Ej: Ajuste de inventario">

            <div class="modal-buttons">
                <button class="btn-cancel" onclick="cerrarModalKilos()">Cancelar</button>
                <button class="btn-confirm" onclick="guardarKilosSucursal()">💾 Guardar Kilos</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc, increment, arrayUnion, getDoc, query, where, addDoc, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCi409CkmXBbun7-POejbVaIiThK2nZ1JY",
            authDomain: "prestamos-18dd8.firebaseapp.com",
            projectId: "prestamos-18dd8",
            storageBucket: "prestamos-18dd8.firebasestorage.app",
            messagingSenderId: "921713515466",
            appId: "1:921713515466:web:0e2bcb5d67067068570d33"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let sucursalSeleccionada = "";
        let sucursalKilosSeleccionada = "";
        let montoAInyectar = 0;

        let cajasDataGlobal = [];
        let cierresDelDiaGlobal = []; 
        let facturasHoyGlobal = []; // Ahora solo guarda las de hoy
        let inventarioGlobalDB = {}; 
        let estadoDiaGlobal = {}; 
        let pedidosContenedoresGlobal = [];
        let kilosSueltoGlobal = [];

        function obtenerFechaHoy() {
            const d = new Date();
            const yyyy = d.getFullYear();
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const dd = String(d.getDate()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd}`;
        }

        // 1. Escuchar Turno Actual
        onSnapshot(collection(db, "cajas_en_vivo"), (snapshot) => {
            cajasDataGlobal = [];
            snapshot.forEach((documento) => {
                cajasDataGlobal.push({ id: documento.id, ...documento.data() });
            });
            renderizarPanel();
        });

        // 2. Escuchar Estado del Día
        onSnapshot(collection(db, "estado_dia"), (snapshot) => {
            estadoDiaGlobal = {};
            snapshot.forEach((documento) => {
                estadoDiaGlobal[documento.id] = documento.data();
            });
            renderizarPanel();
        });

        // 3. Escuchar Cierres del Día
        const hoy = obtenerFechaHoy();
        const qCierres = query(collection(db, "revisiones_faltantes"), where("fecha", "==", hoy));
        onSnapshot(qCierres, (snapshot) => {
            cierresDelDiaGlobal = [];
            snapshot.forEach((documento) => {
                cierresDelDiaGlobal.push(documento.data());
            });
            renderizarPanel(); 
        });

        // 4. Escuchar SOLO las Facturas de HOY (¡Corrección aquí!)
        const qFacturasHoy = query(collection(db, "facturas_compras"), where("fecha", "==", hoy));
        onSnapshot(qFacturasHoy, (snapshot) => {
            facturasHoyGlobal = [];
            snapshot.forEach((documento) => {
                facturasHoyGlobal.push(documento.data());
            });
            renderizarPanel();
        });

        // 5. Escuchar la colección "inventario" (para el inventario histórico real)
        onSnapshot(collection(db, "inventario"), (snapshot) => {
            inventarioGlobalDB = {};
            snapshot.forEach((documento) => {
                // El ID del documento es el nombre de la sucursal (ej. "Perez")
                inventarioGlobalDB[documento.id] = documento.data();
            });
            renderizarPanel();
        });

        // 6. Escuchar Pedidos de Contenedores
        const qContenedores = query(collection(db, "pedidos_contenedores"), orderBy("fecha_registro", "desc"), limit(15));
        onSnapshot(qContenedores, (snapshot) => {
            pedidosContenedoresGlobal = [];
            snapshot.forEach((documento) => {
                pedidosContenedoresGlobal.push({ id: documento.id, ...documento.data() });
            });
            renderizarAlertasContenedores();
        });

        // 7. Escuchar Kilos Sueltos
        const qKilos = query(collection(db, "kilos_sueltos"), orderBy("fecha", "desc"), limit(100));
        onSnapshot(qKilos, (snapshot) => {
            kilosSueltoGlobal = [];
            snapshot.forEach((documento) => {
                kilosSueltoGlobal.push(documento.data());
            });
            renderizarPanel();
        });

        // =====================================================
        // RENDERIZADO DE ALERTAS DE CONTENEDORES
        // =====================================================
        function renderizarAlertasContenedores() {
            const container = document.getElementById('alertas-contenedores');
            const lista = document.getElementById('lista-alertas-contenedores');

            const pendientes = pedidosContenedoresGlobal.filter(p => p.estado === "Pendiente" || !p.estado);

            if (pendientes.length === 0) {
                container.style.display = 'none';
                return;
            }

            container.style.display = 'block';
            lista.innerHTML = '';

            pendientes.forEach(p => {
                lista.innerHTML += `
                    <div class="alerta-item">
                        <div>
                            <span class="alerta-sucursal">📍 ${p.sucursal}</span> 
                            <span class="alerta-detalle">solicitó el contenedor <b>${p.contenedor}</b></span>
                            <div style="font-size:12px; color:#b45309; margin-top:4px;">📅 Para: ${p.fecha_pedido}</div>
                        </div>
                        <button class="btn-resolver-alerta" onclick="marcarContenedorSolicitado('${p.id}')">✔️ Ya Solicitado</button>
                    </div>
                `;
            });
        }

        // =====================================================
        // MARCAR CONTENEDOR COMO SOLICITADO
        // =====================================================
        window.marcarContenedorSolicitado = async function(id) {
            if (!confirm("¿Marcar este contenedor como 'Ya Solicitado'?")) return;
            try {
                await updateDoc(doc(db, "pedidos_contenedores", id), {
                    estado: "Completado"
                });
            } catch (error) {
                console.error(error);
                alert("❌ Error al actualizar: " + error.message);
            }
        };

        // =====================================================
        // RENDERIZADO DEL PANEL PRINCIPAL
        // =====================================================
        function renderizarPanel() {
            const contenedor = document.getElementById('contenedor-cajas');

            if (cajasDataGlobal.length === 0) {
                contenedor.innerHTML = "<p style='color:var(--gray-600);'>No hay cajas activas registradas en este momento.</p>";
                return;
            }

            contenedor.innerHTML = ""; 

            cajasDataGlobal.forEach((data) => {
                const hora = data.ultima_actualizacion ? new Date(data.ultima_actualizacion.toDate()).toLocaleTimeString() : 'En espera';
                const envios = data.admin_envios || [];
                
                const cierresSucursalHoy = cierresDelDiaGlobal.filter(c => c.sucursal === data.sucursal);
                const turnoActual = estadoDiaGlobal[data.sucursal] || {}; 
                
                // --- CÁLCULOS DEL DÍA (Usando las facturas filtradas de hoy) ---
                const facturasSucursalHoy = facturasHoyGlobal.filter(f => f.sucursal === data.sucursal);
                
                let inventarioHoy = {};
                let totalComprasDia = 0;

                facturasSucursalHoy.forEach(f => {
                    totalComprasDia += parseFloat(f.total_factura) || 0;
                    if (f.detalles_materiales) {
                        f.detalles_materiales.forEach(m => {
                            const mat = m.material || 'SIN MATERIAL';
                            const kg = parseFloat(m.kilos) || 0;
                            if (!inventarioHoy[mat]) inventarioHoy[mat] = 0;
                            inventarioHoy[mat] += kg;
                        });
                    }
                });

                // --- CÁLCULOS HISTÓRICOS (DESDE LA COLECCIÓN "INVENTARIO" EN BD) ---
                const inventarioSucursalBD = inventarioGlobalDB[data.sucursal]?.materiales || {};
                
                let inventarioHistoricoAgrupado = {};
                let totalKgHistorico = 0;

                Object.entries(inventarioSucursalBD).forEach(([mat, kg]) => {
                    const kgNum = parseFloat(kg) || 0;
                    if (kgNum > 0) {
                        const matUpper = mat.toUpperCase().trim();
                        if (!inventarioHistoricoAgrupado[matUpper]) inventarioHistoricoAgrupado[matUpper] = 0;
                        inventarioHistoricoAgrupado[matUpper] += kgNum;
                    }
                });

                let invHistHtml = '';
                const entradasHist = Object.entries(inventarioHistoricoAgrupado);
                
                if (entradasHist.length === 0) {
                    invHistHtml = `<div style="padding:10px; text-align:center; font-size:12px; color:var(--gray-400);">Sin historial de compras</div>`;
                } else {
                    entradasHist.sort((a, b) => a[0].localeCompare(b[0])); 
                    entradasHist.forEach(([mat, kg]) => {
                        totalKgHistorico += kg;
                        invHistHtml += `
                            <div class="inv-hist-item">
                                <span>${mat}</span>
                                <span style="color:var(--gray-800); font-weight:800;">${kg.toFixed(2)} kg</span>
                            </div>
                        `;
                    });
                }

                // --- CÁLCULOS DE VENTAS Y GASTOS DEL DÍA ---
                let listaVentasDetalle = [];
                let listaGastosDetalle = [];
                let totalVentasDia = 0;
                let totalGastosDia = 0;

                if (Array.isArray(turnoActual.ventas_lista)) {
                    turnoActual.ventas_lista.forEach(v => {
                        listaVentasDetalle.push({ desc: v.descripcion, monto: v.monto, origen: 'En Curso' });
                        totalVentasDia += v.monto;
                    });
                }
                if (Array.isArray(turnoActual.gastos)) {
                    turnoActual.gastos.forEach(g => {
                        listaGastosDetalle.push({ desc: g.descripcion, monto: g.monto, origen: 'En Curso' });
                        totalGastosDia += g.monto;
                    });
                }

                cierresSucursalHoy.forEach(c => {
                    if (c.detalles_ventas) {
                        c.detalles_ventas.forEach(v => {
                            listaVentasDetalle.push({ desc: v.descripcion, monto: v.monto, origen: 'Cerrado' });
                            totalVentasDia += v.monto;
                        });
                    }
                    if (c.detalles_gastos) {
                        c.detalles_gastos.forEach(g => {
                            listaGastosDetalle.push({ desc: g.descripcion, monto: g.monto, origen: 'Cerrado' });
                            totalGastosDia += g.monto;
                        });
                    }
                });

                let htmlVentas = listaVentasDetalle.length === 0 ? '<div style="color:#94a3b8; font-size:12px; text-align:center;">No hay ventas hoy</div>' : 
                    listaVentasDetalle.map(v => `
                        <div class="lista-item">
                            <span>${v.desc} <span class="badge-origen ${v.origen === 'En Curso' ? 'origen-curso' : 'origen-cerrado'}">${v.origen}</span></span>
                            <span style="color:#059669; font-weight:700;">+₡${v.monto.toLocaleString('es-CR')}</span>
                        </div>
                    `).join('');

                let htmlGastos = listaGastosDetalle.length === 0 ? '<div style="color:#94a3b8; font-size:12px; text-align:center;">No hay gastos hoy</div>' : 
                    listaGastosDetalle.map(g => `
                        <div class="lista-item">
                            <span>${g.desc} <span class="badge-origen ${g.origen === 'En Curso' ? 'origen-curso' : 'origen-cerrado'}">${g.origen}</span></span>
                            <span style="color:#dc2626; font-weight:700;">-₡${g.monto.toLocaleString('es-CR')}</span>
                        </div>
                    `).join('');

                let invHtml = '';
                let totalKg = 0;
                const entradasInv = Object.entries(inventarioHoy).filter(([m, kg]) => Math.abs(parseFloat(kg) || 0) > 0.0001);

                if (entradasInv.length === 0) {
                    invHtml = `<div style="padding:10px; text-align:center; font-size:12px; color:var(--gray-400);">No se han comprado materiales hoy</div>`;
                } else {
                    entradasInv.sort((a, b) => a[0].localeCompare(b[0])); 
                    entradasInv.forEach(([mat, kg]) => {
                        const kgNum = parseFloat(kg) || 0;
                        totalKg += kgNum;
                        invHtml += `
                            <div class="inv-item">
                                <span>${mat}</span>
                                <span style="color:var(--primary); font-weight:800;">${kgNum.toFixed(2)} kg</span>
                            </div>
                        `;
                    });
                }

                // FILTRAR KILOS SUELTOS DE ESTA SUCURSAL Y SUMAR TOTAL
                const kilosSucursal = kilosSueltoGlobal.filter(k => k.sucursal === data.sucursal);
                let kilosTotalHistorial = 0;
                let kilosHtml = '';

                if (kilosSucursal.length === 0) {
                    kilosHtml = '<div style="text-align:center; font-size:11px; color:var(--gray-400); padding:10px;">Sin registros</div>';
                } else {
                    kilosSucursal.slice(0, 10).forEach(k => { 
                        kilosTotalHistorial += parseFloat(k.cantidad) || 0;
                        kilosHtml += `
                            <div class="kilos-mini-item">
                                <span>${k.motivo}</span>
                                <span style="font-weight:800; color:#1e3a8a;">+${k.cantidad} kg</span>
                            </div>
                        `;
                    });
                }

                let enviosHtml = '';
                if (envios.length > 0) {
                    envios.forEach((envio, index) => {
                        enviosHtml += `
                            <div class="envio-item">
                                <span>${envio.motivo}: ₡${(envio.monto||0).toLocaleString('es-CR')}</span>
                                <button onclick="eliminarEnvioAdmin('${data.sucursal}', ${index}, ${envio.monto})" class="btn-eliminar-envio">✕</button>
                            </div>
                        `;
                    });
                }

                contenedor.innerHTML += `
                    <div class="card-caja">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <h3 style="margin:0; color:var(--gray-900);">📍 ${data.sucursal}</h3>
                            <span class="badge-live"><span class="dot"></span> ${hora}</span>
                        </div>

                        <label style="font-size:12px; color:var(--gray-600); font-weight:800; display:block; margin-top:16px; text-transform:uppercase; letter-spacing:0.5px;">Caja Disponible (Turno Actual)</label>
                        <div class="monto-vivo">₡${(data.caja_disponible || 0).toLocaleString('es-CR')}</div>
                        
                        <div>
                            <div class="detalle-item">
                                <span>📥 Base Inicio:</span>
                                <span>₡${(data.caja_inicio || 0).toLocaleString('es-CR')}</span>
                            </div>
                            <div class="detalle-item">
                                <span>➕ Depósitos:</span>
                                <span class="monto-pos">+₡${(data.depositos || 0).toLocaleString('es-CR')}</span>
                            </div>
                            <div class="detalle-item">
                                <span>➕ Ventas:</span>
                                <span class="monto-pos">+₡${(data.ventas || 0).toLocaleString('es-CR')}</span>
                            </div>
                            <div class="detalle-item">
                                <span>➖ Facturas (Turno Actual):</span>
                                <span class="monto-neg">-₡${(data.compras_facturas || 0).toLocaleString('es-CR')}</span>
                            </div>
                            <div class="detalle-item">
                                <span>➖ Gastos:</span>
                                <span class="monto-neg">-₡${(data.gastos || 0).toLocaleString('es-CR')}</span>
                            </div>
                            <div class="detalle-item" style="background: #fef2f2; padding: 10px; border-radius: 6px; margin-top: 5px; border: 1px solid #fecaca;">
                                <span style="color:#991b1b; font-weight:800;">🧾 Total Facturas Hoy:</span>
                                <span class="monto-neg" style="font-size:15px;">-₡${totalComprasDia.toLocaleString('es-CR')}</span>
                            </div>
                        </div>

                        <div class="acordeon-container">
                            <button class="btn-acordeon" onclick="toggleDetalles('${data.sucursal}')">
                                <span>📊 Detalle del Día (Ventas y Gastos)</span>
                                <span id="flecha-det-${data.sucursal}">▼</span>
                            </button>
                            <div id="det-${data.sucursal}" class="acordeon-listado">
                                <div class="lista-header" style="color:#059669;">Ventas (Total Hoy: ₡${totalVentasDia.toLocaleString('es-CR')})</div>
                                ${htmlVentas}
                                <div class="lista-header" style="color:#d97706; margin-top:15px;">Gastos (Total Hoy: ₡${totalGastosDia.toLocaleString('es-CR')})</div>
                                ${htmlGastos}
                            </div>
                        </div>

                        <!-- INVENTARIO DEL DÍA -->
                        <div class="inventario-container" style="margin-top:0; border-top:none;">
                            <button class="btn-toggle-inventario" onclick="toggleInventario('${data.sucursal}')">
                                <span>📦 Materiales Comprados Hoy</span>
                                <span id="flecha-${data.sucursal}">▼</span>
                            </button>
                            <div id="inv-${data.sucursal}" class="inventario-listado">
                                <div class="inv-total">Total Comprado Hoy: ${totalKg.toFixed(2)} kg</div>
                                ${invHtml}
                            </div>
                        </div>

                        <!-- MÓDULO DE KILOS POR SUCURSAL -->
                        <div class="kilos-card-box">
                            <div class="kilos-card-header" onclick="toggleKilos('${data.sucursal}')">
                                <span>⚖️ Kilos Sueltos (Total: ${kilosTotalHistorial.toFixed(2)} kg)</span>
                                <button class="btn-add-kilos" onclick="event.stopPropagation(); abrirModalKilos('${data.sucursal}')">➕ Ingresar</button>
                                <span id="flecha-kilos-${data.sucursal}">▼</span>
                            </div>
                            <div id="kilos-${data.sucursal}" class="kilos-listado-mini">
                                ${kilosHtml}
                            </div>
                        </div>

                        <!-- NUEVO MÓDULO DE INVENTARIO TOTAL (HISTÓRICO REAL) -->
                        <div class="inventario-historico-box">
                            <div class="inventario-historico-header" onclick="toggleInventarioHistorico('${data.sucursal}')">
                                <span>📦 Inventario Total (Histórico)</span>
                                <span id="flecha-invhist-${data.sucursal}">▼</span>
                            </div>
                            <div id="invhist-${data.sucursal}" class="inventario-historico-listado">
                                <div class="inv-hist-total">Total Histórico: ${totalKgHistorico.toFixed(2)} kg</div>
                                ${invHistHtml}
                            </div>
                        </div>

                        <div class="actions-box">
                            <button class="btn-inyectar" onclick="abrirModal('${data.sucursal}')">
                                💸 Inyectar Dinero
                            </button>
                            ${enviosHtml ? `<div class="lista-envios"><label style="margin-top:10px; font-size:11px; text-transform:uppercase;">Envíos Recientes:</label>${enviosHtml}</div>` : ''}
                        </div>
                    </div>
                `;
            });
        }

        // =====================================================
        // FUNCIONES DE UI (Acordeones)
        // =====================================================
        window.toggleDetalles = function(sucursal) {
            const div = document.getElementById(`det-${sucursal}`);
            const flecha = document.getElementById(`flecha-det-${sucursal}`);
            if (div.classList.contains('active')) {
                div.classList.remove('active');
                flecha.innerText = '▼';
            } else {
                div.classList.add('active');
                flecha.innerText = '▲';
            }
        };

        window.toggleInventario = function(sucursal) {
            const div = document.getElementById(`inv-${sucursal}`);
            const flecha = document.getElementById(`flecha-${sucursal}`);
            if (div.classList.contains('active')) {
                div.classList.remove('active');
                flecha.innerText = '▼';
            } else {
                div.classList.add('active');
                flecha.innerText = '▲';
            }
        };

        window.toggleKilos = function(sucursal) {
            const div = document.getElementById(`kilos-${sucursal}`);
            const flecha = document.getElementById(`flecha-kilos-${sucursal}`);
            if (div.classList.contains('active')) {
                div.classList.remove('active');
                flecha.innerText = '▼';
            } else {
                div.classList.add('active');
                flecha.innerText = '▲';
            }
        };

        window.toggleInventarioHistorico = function(sucursal) {
            const div = document.getElementById(`invhist-${sucursal}`);
            const flecha = document.getElementById(`flecha-invhist-${sucursal}`);
            if (div.classList.contains('active')) {
                div.classList.remove('active');
                flecha.innerText = '▼';
            } else {
                div.classList.add('active');
                flecha.innerText = '▲';
            }
        };

        // =====================================================
        // MODAL KILOS
        // =====================================================
        window.abrirModalKilos = function(sucursal) {
            sucursalKilosSeleccionada = sucursal;
            document.getElementById('modal-kilos-sucursal-nombre').innerText = sucursal;
            document.getElementById('input-kilos-cantidad').value = '';
            document.getElementById('input-kilos-fecha').value = new Date().toISOString().split('T')[0];
            document.getElementById('input-kilos-motivo').value = '';
            document.getElementById('modal-kilos').classList.add('active');
        };

        window.cerrarModalKilos = function() {
            document.getElementById('modal-kilos').classList.remove('active');
            sucursalKilosSeleccionada = "";
        };

        window.guardarKilosSucursal = async function() {
            const cantidad = parseFloat(document.getElementById('input-kilos-cantidad').value);
            const fecha = document.getElementById('input-kilos-fecha').value;
            const motivo = document.getElementById('input-kilos-motivo').value.trim();

            if (!cantidad || cantidad <= 0 || !fecha || !motivo) {
                alert("⚠️ Por favor, completa todos los campos correctamente.");
                return;
            }

            try {
                await addDoc(collection(db, "kilos_sueltos"), {
                    sucursal: sucursalKilosSeleccionada,
                    cantidad: cantidad,
                    fecha: fecha,
                    motivo: motivo,
                    timestamp: new Date()
                });
                
                alert("✅ Kilos guardados correctamente.");
                cerrarModalKilos();
            } catch (error) {
                console.error(error);
                alert("❌ Error al guardar kilos: " + error.message);
            }
        };

        // =====================================================
        // MODAL INYECTAR DINERO
        // =====================================================
        window.abrirModal = function(sucursal) {
            sucursalSeleccionada = sucursal;
            document.getElementById('modal-sucursal-nombre').innerText = sucursal;
            document.getElementById('input-monto-inyectar').value = '';
            document.getElementById('input-motivo-inyectar').value = '';
            document.getElementById('modal-inyectar').classList.add('active');
        };

        window.cerrarModal = function() {
            document.getElementById('modal-inyectar').classList.remove('active');
            sucursalSeleccionada = "";
            montoAInyectar = 0;
        };

        window.formatearMoneda = function(input) {
            let valor = input.value.replace(/\D/g, "");
            if (valor) input.value = Number(valor).toLocaleString('es-CR');
            else input.value = "";
            montoAInyectar = Number(valor) || 0;
        };

        window.confirmarInyeccion = async function() {
            const motivo = document.getElementById('input-motivo-inyectar').value.trim();
            
            if (montoAInyectar <= 0) {
                alert("⚠️ Por favor, ingrese un monto válido.");
                return;
            }

            const btn = document.querySelector('#modal-inyectar .btn-confirm');
            btn.disabled = true; btn.innerText = "⏳ Enviando...";

            try {
                const cajaRef = doc(db, "cajas_en_vivo", sucursalSeleccionada);
                
                // 1. Actualizar la caja en vivo (como siempre)
                await updateDoc(cajaRef, {
                    depositos: increment(montoAInyectar),
                    caja_disponible: increment(montoAInyectar),
                    admin_envios: arrayUnion({
                        monto: montoAInyectar,
                        motivo: motivo || "Envío de administración",
                        fecha: new Date().toISOString()
                    })
                });

                // 2. Guardar el registro en la nueva colección "historial_inyecciones"
                await addDoc(collection(db, "historial_inyecciones"), {
                    sucursal: sucursalSeleccionada,
                    monto: montoAInyectar,
                    motivo: motivo || "Envío de administración",
                    fecha: new Date()
                });

                alert(`✅ Se enviaron ₡${montoAInyectar.toLocaleString('es-CR')} a la sucursal ${sucursalSeleccionada}.\nSe guardó el registro histórico.`);
                cerrarModal();
            } catch (error) {
                console.error(error);
                alert("❌ Error al inyectar dinero: " + error.message);
            } finally {
                btn.disabled = false; btn.innerText = "💾 Enviar Dinero";
            }
        };

        // =====================================================
        // ELIMINAR UN ENVÍO EQUIVOCADO
        // =====================================================
        window.eliminarEnvioAdmin = async function(sucursal, index, monto) {
            if (!confirm(`¿Estás seguro de eliminar este envío de ₡${monto.toLocaleString('es-CR')}?\n\nSe restará de la caja de la sucursal.`)) return;
            
            try {
                const cajaRef = doc(db, "cajas_en_vivo", sucursal);
                const snap = await getDoc(cajaRef);
                
                if (snap.exists()) {
                    const data = snap.data();
                    let envios = data.admin_envios || [];
                    
                    envios.splice(index, 1);
                    
                    await updateDoc(cajaRef, {
                        admin_envios: envios,
                        depositos: increment(-monto),
                        caja_disponible: increment(-monto)
                    });
                    alert("✅ Envío eliminado correctamente de la caja.");
                    // NOTA: Si se elimina de la caja, el registro histórico no se borra automáticamente.
                }
            } catch (error) {
                console.error(error);
                alert("❌ Error al eliminar: " + error.message);
            }
        };
    </script>
</body>
</html>
